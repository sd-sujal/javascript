<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color: #fff;  background-image:
    linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 20px 20px;">
    <h1>Sujal Dwivedi</h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    const sayDate = function(str){
        console.log(str,Date.now());
    }
    let intervalId; 
    

    const start = document.querySelector('#start').addEventListener('click',function(){
        intervalId = setInterval(sayDate,1000,"Namaste")
    })
    const stop = document.querySelector('#stop').addEventListener('click',function(){
        clearInterval(intervalId);
    })
</script>
</html>
