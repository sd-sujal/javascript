<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XMLHttpRequest: readyState property</title>
</head>
<body style="background-color: #212121; color: #fff;  background-image:
    linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
  background-size: 20px 20px;">
   <table>
        <thead>
            <tr>
                <th>Value</th>
                <th>State</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>0</td>
                <td>UNSENT</td>
                <td>Client has been created. open() not called yet.</td>
            </tr>
            <tr>
                <td>1</td>
                <td>OPENED</td>
                <td>open() has been called.</td>
            </tr>
            <tr>
                <td>2</td>
                <td>HEADERS_RECEIVED</td>
                <td>send() has been called, and headers and status are available.</td>
            </tr>
            <tr>
                <td>3</td>
                <td>LOADING</td>
                <td>Downloading; responseText holds partial data.</td>
            </tr>
            <tr>
                <td>4</td>
                <td>DONE</td>
                <td>The operation is complete.</td>
            </tr>
        </tbody>
    </table>
</body>
<script>
    const requestUrl = 'https://api.github.com/users/sd-sujalA'
    const xhr = new XMLHttpRequest();
    xhr.opran('GET', requestUrl)
    console.log("here");
    xhr.send()
</script>
</html>
