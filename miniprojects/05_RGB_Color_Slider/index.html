<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Color Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>RGB Color Generator</h1>

    <div class="slider">
        <label>
            Red
            <span id="redValue">0</span>
        </label>
        <input type="range" id="red" min="0" max="255" value="0">
    </div>

    <div class="slider">
        <label>
            Green
            <span id="greenValue">0</span>
        </label>
        <input type="range" id="green" min="0" max="255" value="0">
    </div>

    <div class="slider">
        <label>
            Blue
            <span id="blueValue">0</span>
        </label>
        <input type="range" id="blue" min="0" max="255" value="0">
    </div>

    <div class="color-box" id="colorBox"></div>

    <h2 id="rgbText">rgb(0, 0, 0)</h2>

</div>

<script src="script.js"></script>
</body>
</html>
