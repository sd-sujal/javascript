<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM | Sujal</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <div class="parent">
        <div class="day">monday</div>
        <div class="day">tuesday</div>
        <div class="day">wednesday</div>
        <div class="day">friday</div>
    </div>
    
</body>
<script>
    const myNewDay = document.createElement('div');
myNewDay.innerText = 'Thursday';

// 2. Find where you want to put it (e.g., inside a parent container)
const container = document.querySelector('.parent'); 

// 3. Append it so it actually shows up on the page
container.appendChild(myNewDay);

</script>
</html>
